<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
   <section>
    <h1 style="color: cornflowerblue;">Formulario de Registro</h1>
    <h2>Ingrese sus datos para acceder a la página</h2>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Praesentium, delectus. Perspiciatis alias, laudantium nulla, deserunt ea nemo doloremque nisi ratione neque, tenetur consequatur voluptatum et dolorum sint aut veniam quasi.</p>
    <form action="login.php" method="POST">
        <label for="name" style="color: rgb(28, 106, 184);">Nombre:</label>
        <input type="text" style="border: 2px solid rgb(24, 22, 146); padding: 5px;" required placeholder="María García" id="name"/>
        <br/>
        <br/>
        <label for="email" style="color: rgb(28, 106, 184);">Correo electrónico:</label>
        <input type="email" style="border: 2px solid rgb(24, 22, 146); padding: 5px;" required placeholder="marimar01@gmail.com" id="email"/>
        <br/>
        <br/>
        <label for="pass" style="color: rgb(28, 106, 184);">Contraseña:</label>
        <input type="password" style="border: 2px solid rgb(24, 22, 146); padding: 5px;" required placeholder="****" id="pass"/>
        <br/>
        <br/>
        <button style="background-color: rgb(28, 106, 184); color: white; border: none; padding: 10px 20px; cursor: pointer;">Ingresar</button>
    </form>
   </section>
